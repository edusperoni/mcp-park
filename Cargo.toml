[package]
name = "mcp-park"
version = "0.1.0"
edition = "2021"
description = "Stdio wrapper that keeps an MCP server stopped until a real call needs it"
license = "MIT"
repository = "https://github.com/edusperoni/mcp-park"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "proxy", "lazy"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[package.metadata.dist]
dist = true

[[test]]
name = "integration"
harness = false

# A reader thread that panics must take the wrapper down with it; a wrapper
# that survives with a dead reader hangs the client instead of failing.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
